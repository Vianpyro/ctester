<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ctester — administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/admin.css">
</head>
<body class="loggedout">

<section class="login">
  <h1>ctester <b>administration</b></h1>
  <p>Réservé à l'enseignant.</p>
  <button type="button" id="login-button">Se connecter</button>
  <p class="reason" id="login-reason"></p>
</section>

<header class="bar">
  <h1>ctester <b>administration</b></h1>
  <div class="period" role="group" aria-label="Période des statistiques">
    <button type="button" data-jours="1">24 h</button>
    <button type="button" data-jours="7" aria-pressed="true">7 jours</button>
    <button type="button" data-jours="30">30 jours</button>
    <button type="button" data-jours="120">Session</button>
  </div>
  <p class="state" id="state"><span class="point" id="point"></span><span id="state-text">Chargement</span></p>
</header>

<section class="vitals" id="vitals" aria-label="État du service"></section>

<section class="distribution" aria-label="Répartition des verdicts">
  <div class="gauge" id="gauge"></div>
  <div class="legend" id="legend"></div>
</section>

<main>
  <div class="rail">
    <section class="panel">
      <h2>Workers <span class="note" id="workers-note"></span></h2>
      <div class="body" id="workers"></div>
    </section>
    <section class="panel">
      <h2>File d'attente <span class="note" id="queue-note"></span></h2>
      <div class="body" id="queue"></div>
    </section>
    <section class="panel">
      <h2>Usage <span class="note" id="usage-note"></span></h2>
      <div class="body" id="usage"></div>
    </section>
  </div>

  <section class="panel">
    <h2>Derniers runs
      <span class="filters">
        <label class="toggle" title="Affiche le compte de l'auteur, ou l'étiquette de navigateur d'un run anonyme. Masqué par défaut : un projecteur, un partage d'écran, un collègue qui passe.">
          <input type="checkbox" id="reveal"> données personnelles
        </label>
        <input id="f-exercise" placeholder="exercice" aria-label="Filtrer par exercice">
        <input id="f-status" placeholder="statut" aria-label="Filtrer par statut">
        <input id="f-worker" placeholder="worker" aria-label="Filtrer par worker">
      </span>
    </h2>
    <div class="body" id="runs"></div>
  </section>

  <div class="rail">
    <section class="panel">
      <h2>Par exercice <span class="note" id="exercises-note"></span></h2>
      <div class="body" id="exercises"></div>
    </section>
    <section class="panel">
      <h2>Discussions <span class="note" id="channels-note"></span></h2>
      <div class="body" id="channels"></div>
    </section>
    <section class="panel">
      <h2>Activité <span class="note" id="activity-note"></span></h2>
      <div class="body activity-body" id="activity"></div>
    </section>
  </div>
</main>

<dialog id="code">
  <header>
    <b id="code-title"></b>
    <span class="note" id="code-source"></span>
    <button type="button" id="code-close" aria-label="Fermer">Fermer</button>
  </header>
  <div id="code-body"></div>
</dialog>

<script src="/admin.js" type="module"></script>
</body>
</html>
