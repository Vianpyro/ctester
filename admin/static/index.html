<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ctester — administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/admin.css">
</head>
<body class="deconnecte">

<section class="connexion">
  <h1>ctester <b>administration</b></h1>
  <p>Réservé à l'enseignant.</p>
  <button type="button" id="connexion-bouton">Se connecter</button>
  <p class="raison" id="connexion-raison"></p>
</section>

<header class="barre">
  <h1>ctester <b>administration</b></h1>
  <div class="periode" role="group" aria-label="Période des statistiques">
    <button type="button" data-jours="1">24 h</button>
    <button type="button" data-jours="7" aria-pressed="true">7 jours</button>
    <button type="button" data-jours="30">30 jours</button>
    <button type="button" data-jours="120">Session</button>
  </div>
  <p class="etat" id="etat"><span class="point" id="point"></span><span id="etat-texte">Chargement</span></p>
</header>

<section class="vitaux" id="vitaux" aria-label="État du service"></section>

<section class="repartition" aria-label="Répartition des verdicts">
  <div class="jauge" id="jauge"></div>
  <div class="legende" id="legende"></div>
</section>

<main>
  <div class="rail">
    <section class="panneau">
      <h2>Workers <span class="note" id="workers-note"></span></h2>
      <div class="corps" id="workers"></div>
    </section>
    <section class="panneau">
      <h2>File d'attente <span class="note" id="file-note"></span></h2>
      <div class="corps" id="file"></div>
    </section>
    <section class="panneau">
      <h2>Usage <span class="note" id="usage-note"></span></h2>
      <div class="corps" id="usage"></div>
    </section>
  </div>

  <section class="panneau">
    <h2>Derniers runs
      <span class="filtres">
        <label class="bascule" title="Affiche le compte de l'auteur. Masqué par défaut : un projecteur, un partage d'écran, un collègue qui passe.">
          <input type="checkbox" id="reveler"> données personnelles
        </label>
        <input id="f-exercice" placeholder="exercice" aria-label="Filtrer par exercice">
        <input id="f-statut" placeholder="statut" aria-label="Filtrer par statut">
        <input id="f-worker" placeholder="worker" aria-label="Filtrer par worker">
      </span>
    </h2>
    <div class="corps" id="runs"></div>
  </section>

  <div class="rail">
    <section class="panneau">
      <h2>Par exercice <span class="note" id="exercices-note"></span></h2>
      <div class="corps" id="exercices"></div>
    </section>
    <section class="panneau">
      <h2>Discussions <span class="note" id="canaux-note"></span></h2>
      <div class="corps" id="canaux"></div>
    </section>
    <section class="panneau">
      <h2>Activité <span class="note" id="activite-note"></span></h2>
      <div class="corps corps-activite" id="activite"></div>
    </section>
  </div>
</main>

<dialog id="code">
  <header>
    <b id="code-titre"></b>
    <span class="note" id="code-source"></span>
    <button type="button" id="code-fermer" aria-label="Fermer">Fermer</button>
  </header>
  <div id="code-corps"></div>
</dialog>

<script src="/admin.js" type="module"></script>
</body>
</html>
