# Déploiement de ctester. Même forme que les autres stacks du dépôt, avec deux
# choses en plus : un runtime de conteneur à installer, et un worker systemd sur
# l'hôte qui n'existe que pour que le conteneur exposé n'ait pas le socket Docker.

# --- gVisor ---------------------------------------------------------------
# Installé ici tant qu'il n'a qu'un consommateur. À extraire dans roles/gvisor
# le jour où il y en a deux -- pas avant : un rôle pour trois tâches apt qu'un
# seul playbook utilise, c'est de l'abstraction spéculative.

- name: Install the gVisor apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add the gVisor signing key
  ansible.builtin.get_url:
    url: https://gvisor.dev/archive.key
    dest: /etc/apt/keyrings/gvisor.asc
    mode: "0644"

- name: Add the gVisor apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ctester_apt_arch }} signed-by=/etc/apt/keyrings/gvisor.asc]
      https://storage.googleapis.com/gvisor/releases release main
    filename: gvisor
    state: present

- name: Install runsc
  ansible.builtin.apt:
    name: runsc
    state: present
    update_cache: true

# CE QUI ÉCHOUE ICI EST UN DÉPLOIEMENT, PAS UN SERVICE. Enregistrer runsc auprès
# de Docker demande une entrée dans /etc/docker/daemon.json (voir
# host_vars/vhome-delloptiplex/vars.yml) ET un redémarrage du démon, qui rebondit
# TOUS les conteneurs du Dell : DNS, DHCP, VPN, vault, NPM. Ce dépôt refuse ce
# redémarrage en cours de journée et laisse la fenêtre de 04:00 s'en charger.
#
# Donc, sur une première convergence : ce rôle s'arrête ici avec le message
# ci-dessous, et il faut soit attendre le reboot nocturne, soit
# `systemctl restart docker` dans une fenêtre choisie.
#
# PAS DE REPLI SILENCIEUX SUR runc. Un service qui tourne sans la couche
# d'isolation pour laquelle il a été conçu, sans que personne ne le sache, est
# pire que le service absent. Le repli existe, mais il est explicite et il se
# voit dans l'historique du shell :
#   ansible-playbook playbooks/ctester.yml -e ctester_runtime=runc
- name: Read the container runtimes Docker has registered
  ansible.builtin.command: >-
    docker info --format {% raw %}'{{json .Runtimes}}'{% endraw %}
  register: ctester_runtimes
  changed_when: false
  check_mode: false

- name: Assert the sandbox runtime is registered with Docker
  ansible.builtin.assert:
    that:
      - ctester_runtime in (ctester_runtimes.stdout | from_json)
    fail_msg: >-
      Le runtime '{{ ctester_runtime }}' n'est pas enregistré auprès de Docker.
      Le fichier /etc/docker/daemon.json le déclare peut-être déjà, mais le
      démon ne l'a pas relu : redémarrer Docker dans une fenêtre de maintenance
      (`systemctl restart docker`, qui rebondit TOUS les conteneurs de cet hôte)
      ou attendre le redémarrage nocturne, puis rejouer ce playbook.
    success_msg: "Le bac à sable tournera sous '{{ ctester_runtime }}'."

# --- Répertoires ----------------------------------------------------------

- name: Ensure the ctester project directory exists
  ansible.builtin.file:
    path: "{{ ctester_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the application directory exists
  ansible.builtin.file:
    path: "{{ ctester_project_dir }}/app"
    state: directory
    owner: root
    group: root
    mode: "0755"

# 65534:65534 = nobody, l'utilisateur du conteneur web. C'est le SEUL répertoire
# qu'il peut écrire, et le seul canal entre lui et le worker.
- name: Ensure the spool directory exists and belongs to the web container's user
  ansible.builtin.file:
    path: "{{ ctester_project_dir }}/spool"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0755"

# --- Tests secrets --------------------------------------------------------

- name: Install the read-only deploy key for the test repository
  ansible.builtin.copy:
    content: "{{ ctester_tests_deploy_key }}"
    dest: "{{ ctester_tests_key_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [tests]

# accept_newhostkey plutôt qu'une entrée known_hosts figée : la clé d'hôte de
# github.com a déjà été remplacée une fois (mars 2023), et un known_hosts codé en
# dur transforme cet événement en déploiement cassé un lundi matin. Le TOFU se
# fait ici sur une machine que nous contrôlons, vers un hôte dont l'empreinte est
# publique et vérifiable si le doute vient.
- name: Clone or update the private test repository
  ansible.builtin.git:
    repo: "{{ ctester_tests_repo }}"
    dest: "{{ ctester_project_dir }}/tests"
    version: "{{ ctester_tests_version }}"
    key_file: "{{ ctester_tests_key_path }}"
    accept_newhostkey: true
    force: true
    # Le sous-module `solutions` est cloné par la tâche suivante, avec sa propre
    # clé : la résolution récursive d'Ansible utiliserait l'URL HTTPS de
    # .gitmodules et se bloquerait sur une invite de mot de passe.
    recursive: false
  notify: Restart ctester workers
  tags: [tests]

- name: Install the read-only deploy key for the solutions repository
  ansible.builtin.copy:
    content: "{{ ctester_solutions_deploy_key }}"
    dest: "{{ ctester_solutions_key_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [tests]

# ponytail: on suit la branche du dépôt de solutions, pas le commit épinglé par
# le gitlink du sous-module. Passer à `ctester_solutions_version: <sha>` le jour
# où les deux dépôts doivent avancer ensemble.
- name: Clone or update the solutions repository into the submodule path
  ansible.builtin.git:
    repo: "{{ ctester_solutions_repo }}"
    dest: "{{ ctester_project_dir }}/tests/solutions"
    version: "{{ ctester_solutions_version }}"
    key_file: "{{ ctester_solutions_key_path }}"
    accept_newhostkey: true
    force: true
  notify: Restart ctester workers
  tags: [tests]

# APPARTIENT À root, MAIS EST LISIBLE PAR TOUS, et ce n'est pas un oubli : le
# 0700 qui semble évident ici rendrait les tests illisibles là où ils doivent
# l'être. Un bind mount ne remappe pas les uid -- le bac à sable tourne en 65534
# (jamais root, c'est non négociable), donc gcc ne peut compiler les tests que si
# le mode de l'hôte les laisse lire à « other ».
#
# CE QUE ÇA COÛTE, exactement : tout processus de l'hôte qui monte ou lit ce
# chemin voit les tests. Aucun ne le fait -- le conteneur web, le seul exposé à
# Internet, ne monte PAS ce répertoire, et c'est la défense qui compte. La
# confidentialité des tests vient du filtrage de la sortie (voir
# build-unity.sh), pas d'un mode de fichier sur une machine dont l'accès shell
# est déjà la fin de la partie.
#
# `u=rwX,go=rX` : le X majuscule met le bit d'exécution sur les répertoires
# seulement, donc les .c restent en 0644 et les dossiers traversables en 0755.
- name: Set the test tree readable by the sandbox user
  ansible.builtin.file:
    path: "{{ ctester_project_dir }}/tests"
    state: directory
    owner: root
    group: root
    mode: "u=rwX,go=rX"
    recurse: true
  tags: [tests]

# LE RAISONNEMENT CI-DESSUS NE COUVRE PAS CES DEUX-LÀ. Le mode « other » existe
# parce que gcc, en uid 65534, doit lire les sources de test à travers un bind
# mount. quiz.json et io.json ne sont montés dans AUCUN conteneur -- ils sont lus
# par le worker, qui est root -- et ce sont pourtant les fichiers les plus
# secrets du dépôt : l'un est le corrigé, l'autre les valeurs attendues.
#
# Ils repassent donc en 0600. Ça ne protège de rien qu'un accès shell sur le Dell
# ne donnerait déjà, mais laisser un corrigé en 0644 « parce que le répertoire
# l'était » est exactement le genre d'élargissement qu'on ne remarque plus.
- name: Find the answer keys, which no container ever mounts
  ansible.builtin.find:
    paths: "{{ ctester_project_dir }}/tests"
    patterns: ["quiz.json", "io.json"]
    recurse: true
  register: ctester_keys
  tags: [tests]

- name: Restrict the answer keys to root
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ ctester_keys.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [tests]

# LE CATALOGUE N'EST RENDU NULLE PART DANS CE RÔLE, ET C'EST DÉLIBÉRÉ. La liste
# des TP (app/tps.json) et les questions de quiz débarrassées de leur corrigé
# (app/quiz/*.json) sont écrites par le worker au démarrage -- voir
# publish_catalogue() dans runner.py. Le clone ci-dessus notifie leur
# redémarrage, donc `--tags tests` republie tout.
#
# Pourquoi pas une boucle Jinja ici : « le corrigé ne franchit jamais la
# frontière » est une propriété qu'on veut pouvoir VÉRIFIER. En Python c'est une
# fonction que test_ctester.py met à l'épreuve à chaque convergence ; en Jinja
# ç'aurait été un gabarit que personne ne relit et qu'aucun test ne couvre.

# --- Application ----------------------------------------------------------

- name: Deploy the web application
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ctester_project_dir }}/app/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - app.py
    - index.html
  notify: Recreate ctester

- name: Deploy the host-side worker and its self-check
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ctester_project_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - runner.py
    - test_ctester.py
  notify: Restart ctester workers

# Un script par mode compilé. Ils ne sont PAS interchangeables : celui d'Unity
# tait la stderr de l'édition de liens parce qu'elle citerait les tests, celui
# d'io la laisse passer entière parce qu'il ne voit aucun secret. Les fusionner
# reviendrait à faire dépendre la confidentialité d'un `if` bien placé.
- name: Render the sandbox build scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ctester_project_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - build-unity.sh
    - build-io.sh

- name: Render the web configuration
  ansible.builtin.template:
    src: ctester.env.j2
    dest: "{{ ctester_project_dir }}/ctester.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Recreate ctester

- name: Render the ctester compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ ctester_project_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate ctester

# --- Worker ---------------------------------------------------------------

- name: Render the worker unit
  ansible.builtin.template:
    src: ctester-runner@.service.j2
    dest: /etc/systemd/system/ctester-runner@.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart ctester workers

- name: Enable the worker instances
  ansible.builtin.systemd:
    name: "ctester-runner@{{ item }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ range(1, ctester_workers | int + 1) | list }}"

# --- Stack ----------------------------------------------------------------

- name: Ensure the shared ingress network exists
  community.docker.docker_network:
    name: "{{ ingress_network }}"
    state: present

# Pré-tirée ici pour que le premier étudiant de la session ne paie pas 1,3 Go de
# téléchargement dans son délai de compilation -- le bac à sable n'a pas de
# réseau et ne peut donc pas la tirer lui-même au moment du besoin.
- name: Pull the sandbox image
  community.docker.docker_image_pull:
    name: "{{ ctester_sandbox_image }}"
  when: not ansible_check_mode

- name: Ensure the ctester stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ ctester_project_dir }}"
    state: present
    pull: always
  when: not ansible_check_mode

- name: Apply pending ctester handlers before verifying
  ansible.builtin.meta: flush_handlers

# --- Vérification ---------------------------------------------------------

# Pas de sonde HTTP : le conteneur ne publie aucun port sur l'hôte, donc il n'y
# a rien à curler ici. « Le conteneur que Compose vient de converger tourne »
# est ce que ce rôle promet ; l'accessibilité de bout en bout est le travail du
# moniteur Uptime Kuma. Même raisonnement que le rôle penny_game.
- name: Verify the ctester container is running
  community.docker.docker_container_info:
    name: "{{ ctester_container_name }}"
  register: ctester_state
  failed_when: >-
    not ctester_state.exists
    or ctester_state.container.State.Status != 'running'
  changed_when: false
  when: not ansible_check_mode

# TOUT CE QU'IL VÉRIFIE SE TROMPE SANS PLANTER : le parsing de la sortie Unity,
# la liste blanche d'en-têtes, le rang dans la file, les quotas, le refus d'une
# clé fausse et l'impossibilité de servir un fichier arbitraire. Un service
# cassé sur l'un de ces points continue de répondre 200 à tout le monde. Une
# seconde par convergence.
- name: Run the ctester self-check
  ansible.builtin.command: "python3 {{ ctester_project_dir }}/test_ctester.py"
  environment:
    # Sinon la vérification sème des __pycache__ dans un répertoire d'application
    # que Docker monte en lecture seule -- inoffensif, et déroutant à trouver.
    PYTHONDONTWRITEBYTECODE: "1"
  changed_when: false
  when: not ansible_check_mode
