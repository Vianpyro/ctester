# CI de ctester. Deux jobs, et rien de plus.
#
#   tests   les deux suites qui tournent sans le dépôt privé de corrigés.
#           test_bac_a_sable.py et valider_contenu.py exigent `unittests` :
#           ils restent des outils de contrôleur et n'entrent pas ici. Une CI
#           publique n'a pas à détenir la deploy key des corrigés.
#   codeql  l'analyse statique. Ce dépôt sert une API exposée à Internet sur
#           une infra personnelle ; un scan sur le chemin de la requête vaut
#           mieux qu'une relecture une fois par an.
#   pages   publie `web/` sur GitHub Pages. DANS CE FICHIER et pas dans un
#           workflow à part : `needs: tests` est alors la garantie, en une
#           ligne, qu'une page cassée ne se déploie pas toute seule. Un
#           `workflow_run` séparé aurait demandé un aiguillage pour dire la
#           même chose.
#
# LES PERMISSIONS SONT AU PLUS BAS À LA RACINE et remontées job par job. Un
# workflow qui laisse le GITHUB_TOKEN en écriture par défaut donne ce droit à
# tout ce qui s'exécute dedans, y compris à la dépendance d'une action.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Le jeton n'a aucune raison de rester dans .git/config après le
          # clone : rien ici ne pousse.
          persist-credentials: false
      # LA MÊME VERSION QUE LA PRODUCTION (python:3.13-slim). Tester sur le
      # python du runner laisserait passer ce qui casse sur le serveur.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # jsdom, ET RIEN D'AUTRE. DOMPurify refuse de travailler sans DOM :
      # `isSupported` passe à faux et `sanitize()` rend son entrée telle
      # quelle. Un harnais qui tournerait dans cet état écrirait « aucune
      # injection ne passe » sans avoir rien assaini. L'APPLICATION, elle, n'a
      # aucune dépendance npm.
      - run: npm ci
      - run: python3 test_ctester.py
      - run: node test_page.js

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # le seul droit d'écriture du fichier : publier les alertes
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          # javascript-typescript couvre aussi le <script> de index.html.
          # Pas d'autobuild : rien ici ne se compile.
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v4

  # LE DÉPLOIEMENT DE LA PAGE. Aucun build : l'artefact est `web/` tel quel,
  # c'est-à-dire exactement ce que le dépôt contient. Rien n'est compilé, rien
  # n'est assemblé, rien n'est minifié -- ce que la revue lit est ce que le
  # navigateur reçoit.
  pages:
    needs: tests
    # Seulement sur `main`, jamais sur une PR : une PR ne doit pas pouvoir
    # publier. Le job est alors sauté et n'apparaît pas en échec.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write    # l'OIDC que deploy-pages échange, pas un secret stocké
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    # Le `concurrency` de la racine porte déjà sur `workflow-ref` : deux pushes
    # rapprochés sur `main` s'annulent l'un l'autre, ce qui est le comportement
    # voulu pour un déploiement.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deploiement
