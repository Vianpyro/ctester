name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - name: Install the pinned Typst
        run: |
          set -euo pipefail
          V=0.15.1
          SHA=a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
          curl -sSLo typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v$V/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "$SHA  typst.tar.xz" | sha256sum -c -
          tar xJf typst.tar.xz
          echo "CTESTER_TYPST_BIN=$PWD/typst-x86_64-unknown-linux-musl/typst" >> "$GITHUB_ENV"
      - run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
      - run: npm run build
      - run: npm test
      # A hang dumps every thread's stack (faulthandler on SIGABRT) instead of an empty log.
      - run: timeout --signal=ABRT 300 python3 -X faulthandler tests/test_ctester.py
      - run: timeout --signal=ABRT 300 python3 -X faulthandler tests/test_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  judge:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: judge
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - if: runner.os == 'Linux'
        run: cargo install cargo-audit --locked && cargo audit

  # deploy/pull.sh deploys a commit only once this release exists and its attestation verifies.
  judge-release:
    needs: [tests, judge]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - working-directory: judge
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - run: |
          cp judge/target/x86_64-unknown-linux-musl/release/ctester-judge .
          sha256sum ctester-judge > ctester-judge.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ctester-judge
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "judge-$GITHUB_SHA" ctester-judge ctester-judge.sha256 \
            --target "$GITHUB_SHA" --title "judge $GITHUB_SHA" --notes "Built by CI." --prerelease

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # le seul droit d'écriture du fichier : publier les alertes
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v4

  pages:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write    # l'OIDC que deploy-pages échange, pas un secret stocké
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: page
          path: page
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: page
      - uses: actions/deploy-pages@v5
        id: deploiement
