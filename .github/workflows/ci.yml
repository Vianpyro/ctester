# CI de ctester. Trois jobs, et rien de plus.
#
#   tests   tout ce qui tourne sans le dépôt privé de corrigés : les types, le
#           build, les suites de la page, `test_ctester.py` et `test_api.py`.
#           `test_sandbox.py` et `verify_content.py` exigent `unittests` (et gcc) :
#           ils restent des outils de contrôleur et n'entrent pas ici. Une CI
#           publique n'a pas à détenir la deploy key des corrigés.
#   codeql  l'analyse statique. Ce dépôt sert une API exposée à Internet sur
#           une infra personnelle ; un scan sur le chemin de la requête vaut
#           mieux qu'une relecture une fois par an.
#   pages   publie la page CONSTRUITE sur GitHub Pages. DANS CE FICHIER et pas
#           dans un workflow à part : `needs: tests` est alors la garantie, en
#           une ligne, qu'une page cassée ne se déploie pas toute seule. Un
#           `workflow_run` séparé aurait demandé un aiguillage pour dire la
#           même chose.
#
# LA PAGE SE CONSTRUIT MAINTENANT, et c'est le seul changement de ce fichier
# depuis la migration : l'artefact n'est plus `web/` tel quel mais
# `frontend/dist`, écrit par Vite. Ce qui est publié reste du statique -- pas de
# SSR, pas de serveur -- et le dépôt garde ses sources en clair : `dist/` n'est
# pas commité, il est reconstruit ici.
#
# LE BUILD TOURNE DANS LE JOB `tests`, PAS SEULEMENT DANS `pages`. Deux suites
# lisent l'artefact : `frontend/tests/bundle.test.ts` (ce que l'anonyme
# télécharge) et `test_ctester.py::test_csp_du_document` (la politique du
# document servi). Construire une seconde fois dans `pages` serait deux
# artefacts pour une revue, dont un seul éprouvé -- alors il est passé de l'un à
# l'autre.
#
# LES PERMISSIONS SONT AU PLUS BAS À LA RACINE et remontées job par job. Un
# workflow qui laisse le GITHUB_TOKEN en écriture par défaut donne ce droit à
# tout ce qui s'exécute dedans, y compris à la dépendance d'une action.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Le jeton n'a aucune raison de rester dans .git/config après le
          # clone : rien ici ne pousse.
          persist-credentials: false
      # LA MÊME VERSION QUE LA PRODUCTION (python:3.13-slim). Tester sur le
      # python du runner laisserait passer ce qui casse sur le serveur.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # `requirements-dev.txt` ET PAS `requirements.txt` : le premier tire le
      # second, et y ajoute `httpx2`, dont `fastapi.testclient` est une façade.
      # SANS LUI, `test_api.py` SORT EN 1 EN LE DISANT -- et il ne l'avait
      # jamais eu ici, parce que la CI ne lançait longtemps que `test_ctester.py`,
      # qui est en pur Python. C'est cette ligne qui manquait le jour où
      # `test_api.py` est entré dans le fichier.
      #
      # `test_api.py` NE DEMANDE RIEN DE PRIVÉ, et c'est ce qui lui permet
      # d'être ici : il publie son propre contenu dans un répertoire temporaire,
      # là où `test_sandbox.py` et `verify_content.py` exigent le dépôt de
      # corrigés (et gcc), et restent donc des outils de contrôleur.
      - run: pip install -r requirements-dev.txt
      # LE TYPAGE D'ABORD : `svelte-check` voit ce qu'un test ne voit pas -- une
      # propriété qui n'existe pas, une charge d'API mal lue, un `{@const}` mal
      # placé. C'est ce qui a remplacé le `node --check` de l'ancienne page, et
      # c'est strictement plus fort.
      - run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
      # LE BUILD, dont deux suites lisent l'artefact (voir l'en-tête).
      - run: npm run build
      - run: npm test
      - run: python3 test_ctester.py
      # LA FRONTIÈRE HTTP, et elle éprouve `routers/page.py` -- dont le motif
      # d'`assets/` est ce que la construction de la page a coûté au serveur.
      - run: python3 test_api.py
      # L'ARTEFACT PASSE AU JOB `pages` plutôt que d'être reconstruit là-bas :
      # ce qui se déploie est exactement ce que les suites viennent d'éprouver.
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # le seul droit d'écriture du fichier : publier les alertes
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          # javascript-typescript couvre `frontend/src`.
          # Pas d'autobuild : l'analyse lit les sources, elle n'a pas besoin du
          # paquet, et un build ici serait un second artefact non déployé.
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v4

  # LE DÉPLOIEMENT DE LA PAGE. L'artefact vient du job `tests`, qui l'a
  # construit ET éprouvé : rien n'est recompilé ici, donc rien ne peut différer
  # de ce qui a passé les contrôles.
  pages:
    needs: tests
    # Seulement sur `main`, jamais sur une PR : une PR ne doit pas pouvoir
    # publier. Le job est alors sauté et n'apparaît pas en échec.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write    # l'OIDC que deploy-pages échange, pas un secret stocké
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    # Le `concurrency` de la racine porte déjà sur `workflow-ref` : deux pushes
    # rapprochés sur `main` s'annulent l'un l'autre, ce qui est le comportement
    # voulu pour un déploiement.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: page
          path: page
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: page
      - uses: actions/deploy-pages@v4
        id: deploiement
