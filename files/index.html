<!doctype html>
<!-- ctester -- la page étudiante. Fichier géré par Ansible : éditer le rôle.

     Aucun framework et aucune ressource externe : la page est servie par le
     même processus Python que l'API, dans un conteneur en lecture seule. Ce
     qu'elle sait faire tient en 80 lignes de JS, et une dépendance CDN serait
     une requête vers l'extérieur sur une page qui n'en fait aucune.

     LA CLÉ DE SESSION VIENT DE L'URL (?k=...), telle que distribuée sur Moodle.
     Elle n'authentifie personne : elle empêche seulement que le premier scanner
     venu trouve un endpoint qui compile du C. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TCH009 — Tester mon code</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --fg: #1a1a18; --muted: #6b6b66;
    --line: #d8d8d2; --card: #fff;
    --ok: #1f7a3d; --bad: #b3261e; --wait: #8a6d1f;
    --syn-comment: #7d8a7d; --syn-string: #1f7a3d; --syn-pre: #9b2f8f;
    --syn-key: #1d4ed8; --syn-num: #a55200; --syn-fn: #7a5c00;
    --syn-const: #8a3d9b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --fg: #e8e8e4; --muted: #9a9a94;
      --line: #303236; --card: #1d1f23;
      --ok: #6cc48a; --bad: #f2837c; --wait: #d8bb6a;
      --syn-comment: #6e7a70; --syn-string: #9ecf8a; --syn-pre: #d68fd0;
      --syn-key: #7fb0f2; --syn-num: #e0a06a; --syn-fn: #e8d08a;
      --syn-const: #c9a2e8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
  }
  main { max-width: 52rem; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.5rem; color: var(--muted); }
  .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap;
         margin-bottom: .75rem; }
  select, button, textarea, input {
    font: inherit; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: 6px; padding: .5rem .7rem;
  }
  /* L'ÉDITEUR COLORÉ, ET POURQUOI IL EST BÂTI COMME ÇA.
     Un <textarea> ne sait afficher que du texte brut : aucune propriété CSS ne
     colore son contenu. La seule façon de garder une vraie zone de saisie --
     avec Ctrl+Z, le collage, le correcteur du navigateur, la sélection -- est
     de superposer un <pre> coloré DERRIÈRE un textarea dont le texte est
     transparent. On voit le pre, on tape dans le textarea.

     CE QUI CASSE CE MONTAGE : la moindre différence de métrique entre les deux.
     Police, taille, interligne, marge intérieure, bordure, tabulation, gestion
     des espaces : tout ce qui décale le texte d'un pixel décale les couleurs.
     Les deux règles ci-dessous sont donc écrites ENSEMBLE et doivent le rester.
     Si les couleurs dérivent du texte, c'est ici qu'il faut regarder. */
  #editor { position: relative; }
  #hl, #code {
    margin: 0; box-sizing: border-box;
    padding: .5rem .7rem;
    border: 1px solid var(--line); border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 13.5px; line-height: 1.5; tab-size: 4;
    white-space: pre;
  }
  #hl {
    position: absolute; inset: 0;
    background: var(--card); color: var(--fg);
    overflow: hidden;          /* le défilement est piloté par le textarea */
    pointer-events: none;      /* les clics traversent jusqu'à la saisie */
  }
  #code {
    position: relative; width: 100%; min-height: 22rem; resize: vertical;
    overflow: auto;
    background: transparent;
    color: transparent;        /* on lit le calque, pas le textarea */
    caret-color: var(--fg);    /* mais le curseur, lui, doit rester visible */
  }
  /* Le texte du textarea est transparent -- son PLACEHOLDER l'était donc aussi,
     et l'invite « colle ici ton fichier » disparaissait. Il faut le recolorer
     explicitement. */
  #code::placeholder { color: var(--muted); opacity: 1; }
  /* Sélection semi-transparente, et c'est structurel : le textarea est AU-DESSUS
     du calque coloré, donc une sélection opaque masquerait le texte qu'on est en
     train de sélectionner. En rgba() plutôt qu'en color-mix() pour que ça marche
     aussi sur un navigateur d'école qui a trois ans. */
  #code::selection { background: rgba(125, 160, 255, .35); }

  /* Palette de coloration. Volontairement sobre : six catégories, pas trente,
     parce qu'un TP de première session n'en contient pas plus. */
  .tc { color: var(--syn-comment); font-style: italic; }
  .ts { color: var(--syn-string); }
  .tp { color: var(--syn-pre); }
  .tk { color: var(--syn-key); font-weight: 600; }
  .tn { color: var(--syn-num); }
  .tf { color: var(--syn-fn); }
  .tu { color: var(--syn-const); }
  button { cursor: pointer; font-weight: 600; }
  button:disabled { cursor: not-allowed; opacity: .55; }
  #out {
    margin-top: 1rem; padding: 1rem; border: 1px solid var(--line);
    border-radius: 6px; background: var(--card); display: none;
  }
  #out.show { display: block; }
  #quiz .qgroup {
    margin: 1.4rem 0 .4rem; font-weight: 700; font-size: .95rem;
    border-bottom: 1px solid var(--line); padding-bottom: .3rem;
  }
  #quiz .qrow { display: flex; gap: .75rem; align-items: center; margin: .35rem 0; }
  #quiz .qrow span { flex: 1 1 20rem; }
  #quiz .qrow input {
    flex: 0 0 11rem;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .case { margin-top: .9rem; }
  .case .why { color: var(--bad); }
  .verdict { font-size: 1.1rem; font-weight: 700; margin-bottom: .5rem; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .wait { color: var(--wait); }
  ul { margin: .5rem 0 0; padding-left: 1.2rem; }
  li { font-family: ui-monospace, Consolas, monospace; font-size: 13.5px; }
  pre {
    margin: .5rem 0 0; padding: .75rem; overflow-x: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    font-size: 13px; white-space: pre-wrap; word-break: break-word;
  }
  footer { margin-top: 2rem; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>TCH009 — Tester mon code</h1>
  <p class="sub">Choisis ton TP, puis colle ton fichier <code>.c</code> ou
     saisis tes réponses selon l'exercice. Les résultats ne sont pas une note.</p>

  <div class="row">
    <label for="tp">TP&nbsp;:</label>
    <select id="tp"></select>
    <input type="file" id="file" accept=".c,.txt">
    <button id="go">Tester</button>
  </div>

  <div id="editor">
    <pre id="hl" aria-hidden="true"><code id="hlcode"></code></pre>
    <textarea id="code" spellcheck="false"
              placeholder="// Colle ici le contenu de ton fichier .c"></textarea>
  </div>

  <div id="quiz" hidden></div>

  <div id="out"></div>

  <footer>
    Un exercice à la fois. Les tests utilisés ici sont un
    sous-ensemble&nbsp;: ils t'aident à trouver tes erreurs, ils ne remplacent
    pas la correction.
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const key = new URLSearchParams(location.search).get("k") || "";
const out = $("out");

function show(cls, title, extra) {
  out.className = "show";
  out.innerHTML = "";
  const h = document.createElement("div");
  h.className = "verdict " + cls;
  h.textContent = title;
  out.append(h);
  if (extra) out.append(extra);
}

function list(items) {
  const ul = document.createElement("ul");
  for (const it of items) {
    const li = document.createElement("li");
    li.textContent = it;               // textContent : la sortie du juge n'est
    ul.append(li);                     // jamais interprétée comme du HTML
  }
  return ul;
}

function block(text) {
  const pre = document.createElement("pre");
  pre.textContent = text;
  return pre;
}

// Le catalogue est [{id, mode, label}], publié par le worker. Le MODE décide de
// tout ce qui suit : ce que la page affiche, et ce qu'elle envoie.
let catalogue = [];

const current = () => catalogue.find(t => t.id === $("tp").value) || null;

fetch("tps.json").then(r => r.json()).then(tps => {
  catalogue = tps;
  for (const tp of tps) {
    const o = document.createElement("option");
    o.value = tp.id;
    o.textContent = tp.label || tp.id;
    $("tp").append(o);
  }
  if (!tps.length) show("bad", "Aucun TP n'est publié pour l'instant.");
  switchMode();
});

$("tp").addEventListener("change", switchMode);

function switchMode() {
  const tp = current();
  const quiz = tp && tp.mode === "quiz";
  // #editor et pas #code : le calque coloré est un frère du textarea, cacher
  // l'un sans l'autre laisserait le pre seul à l'écran.
  $("editor").hidden = quiz;
  $("file").hidden = quiz;
  $("quiz").hidden = !quiz;
  out.className = "";
  if (quiz) loadQuiz(tp.id); else paint();
}

async function loadQuiz(id) {
  const box = $("quiz");
  box.textContent = "Chargement…";
  const data = await (await fetch("quiz/" + id + ".json")).json();
  box.textContent = "";
  let group = null;
  for (const q of data.questions) {
    if (q.group !== group) {
      group = q.group;
      const head = document.createElement("div");
      head.className = "qgroup";
      head.textContent = group;
      box.append(head);
    }
    const row = document.createElement("div");
    row.className = "qrow";
    const label = document.createElement("span");
    label.textContent = q.label;
    const input = document.createElement("input");
    input.type = "text";
    input.spellcheck = false;
    input.autocomplete = "off";
    input.dataset.qid = q.id;
    row.append(label, input);
    box.append(row);
  }
}

const answers = () => Object.fromEntries(
  [...$("quiz").querySelectorAll("input[data-qid]")].map(i => [i.dataset.qid, i.value])
);

// --- Coloration syntaxique -------------------------------------------------
const ESC = {"&": "&amp;", "<": "&lt;", ">": "&gt;"};
const esc = (s) => s.replace(/[&<>]/g, (c) => ESC[c]);

const KEYWORDS = "auto|break|case|char|const|continue|default|do|double|else|" +
  "enum|extern|float|for|goto|if|inline|int|long|register|restrict|return|" +
  "short|signed|sizeof|static|struct|switch|typedef|union|unsigned|void|" +
  "volatile|while|bool|true|false|NULL";

// UNE SEULE passe et UNE SEULE alternation : l'ordre des branches EST la
// priorité. Le commentaire d'abord, la chaîne ensuite -- sinon le `//` d'une
// URL dans une chaîne ouvrirait un commentaire, et une apostrophe dans un
// commentaire ouvrirait une chaîne. Colorer par remplacements successifs
// produit exactement ces deux bugs, et ils sont pénibles à voir venir.
const C_RE = new RegExp([
  "(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)",                  // 1 commentaire
  "(\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*')",  // 2 chaîne / caractère
  "(^[ \\t]*#[ \\t]*\\w+)",                                  // 3 préprocesseur
  "\\b(" + KEYWORDS + ")\\b",                                // 4 mot-clé
  "\\b(\\d[\\w.]*)",                                         // 5 nombre
  "([A-Za-z_]\\w*)(?=\\s*\\()",                              // 6 appel de fonction
  "\\b([A-Z][A-Z0-9_]{2,})\\b"                               // 7 constante
].join("|"), "gm");

const CLASS = ["tc", "ts", "tp", "tk", "tn", "tf", "tu"];

function highlight(src) {
  let out = "", last = 0;
  for (const m of src.matchAll(C_RE)) {
    out += esc(src.slice(last, m.index));
    const which = m.slice(1, CLASS.length + 1).findIndex(g => g !== undefined);
    // ÉCHAPPEMENT APRÈS LE DÉCOUPAGE, JAMAIS AVANT. Tokeniser du HTML déjà
    // échappé ferait matcher `&lt;` et `&amp;` comme du code -- et surtout,
    // oublier d'échapper laisserait un printf("<script>") d'étudiant s'exécuter
    // dans sa propre page. Tout ce qui sort d'ici passe par esc().
    out += '<span class="' + CLASS[which] + '">' + esc(m[0]) + "</span>";
    last = m.index + m[0].length;
  }
  // Le \n final : sans lui, la dernière ligne vide du textarea manque au calque
  // et le défilement dérive d'une ligne en bas de fichier.
  return out + esc(src.slice(last)) + "\n";
}

function paint() {
  $("hlcode").innerHTML = highlight($("code").value);
  $("hl").scrollTop = $("code").scrollTop;
  $("hl").scrollLeft = $("code").scrollLeft;
}

$("code").addEventListener("input", paint);
$("code").addEventListener("scroll", paint);

$("file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (f) { $("code").value = await f.text(); paint(); }
});

// Les cas ratés : le numéro, LES ENTRÉES et TA sortie. Jamais la valeur
// attendue -- elle transformerait le débogage en recopie.
function cases(items) {
  const box = document.createElement("div");
  for (const c of items) {
    const wrap = document.createElement("div");
    wrap.className = "case";
    const why = document.createElement("div");
    why.className = "why";
    why.textContent = `Cas ${c.case} : ${c.reason}`;
    const io = document.createElement("pre");
    io.textContent = "entrées :\n" + c.stdin +
                     "\nta sortie :\n" + (c.stdout || "(rien)");
    wrap.append(why, io);
    box.append(wrap);
  }
  return box;
}

const UNITS = {quiz: "réponses justes", io: "cas réussis", unity: "tests réussis"};

function render(r) {
  if (r.status !== "ok") {
    show("bad", r.message, r.status === "compile_error" ? block(r.gcc || "") : null);
    return;
  }
  const all = r.passed === r.total;
  const title = `${r.passed} / ${r.total} ${UNITS[r.kind] || "réussis"}`;
  if (all) { show("ok", title); return; }
  if (r.kind === "quiz") {
    show("bad", title,
         list(r.wrong.map(w => w.label + (w.hint ? " — " + w.hint : ""))));
  } else if (r.kind === "io") {
    show("bad", title, cases(r.cases));
  } else {
    show("bad", title, r.failed.length ? list(r.failed) : null);
  }
}

async function poll(id, tries) {
  const r = await fetch("r/" + id);
  const body = await r.json().catch(() => ({state: "error"}));
  if (body.state === "done") { render(body); $("go").disabled = false; return; }
  if (r.status === 404 || tries <= 0) {
    show("bad", "Résultat perdu. Relance les tests.");
    $("go").disabled = false;
    return;
  }
  show("wait", body.state === "running"
       ? "Compilation en cours…"
       : `En file d'attente — ${body.position}${body.position === 1 ? "er" : "e"}`);
  setTimeout(() => poll(id, tries - 1), 2000);
}

$("go").addEventListener("click", async () => {
  const tp = current();
  if (!tp) { show("bad", "Choisis un TP."); return; }
  const body = {key, tp: tp.id};
  if (tp.mode === "quiz") {
    body.answers = answers();
    if (!Object.values(body.answers).some(v => v.trim())) {
      show("bad", "Aucune réponse saisie."); return;
    }
  } else {
    body.code = $("code").value;
    if (!body.code.trim()) { show("bad", "Il n'y a rien à tester."); return; }
  }
  $("go").disabled = true;
  show("wait", "Envoi…");
  try {
    const r = await fetch("submit", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    // `out` et pas `body` : ce nom est déjà celui de la charge utile juste
    // au-dessus, et le redéclarer ici le masquait dans TOUT ce bloc -- y
    // compris sur la ligne qui l'utilise, plus haut. Zone morte temporelle,
    // ReferenceError, fetch jamais parti, et le catch en dessous qui maquillait
    // le tout en panne serveur. Ne pas réutiliser ce nom.
    //
    // La réponse n'est pas toujours du JSON : une page de blocage Cloudflare ou
    // une erreur nginx arrive en HTML, et `r.json()` lève. Sans ce garde, une
    // règle WAF ressemble exactement à un serveur éteint.
    let out = null;
    try { out = await r.json(); } catch (parseError) { out = null; }
    if (!r.ok || !out) {
      show("bad", (out && out.error) ||
                  `Le serveur a répondu ${r.status} sans JSON exploitable.`);
      $("go").disabled = false;
      return;
    }
    // 150 tentatives x 2 s = 5 minutes, largement au-dessus du pire cas d'une
    // classe entière qui soumet en même temps.
    poll(out.id, 150);
  } catch (e) {
    // Le message de l'exception, pas un texte générique : c'est la différence
    // entre « diagnostic en cinq secondes » et « aller-retour avec le serveur ».
    show("bad", "Le serveur est injoignable : " + e.message);
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
